[project]
name = "arbalest"
version = "0.1.0"
description = "Autonomous DevSecOps AI Scanner and Swarm Defense"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "neo4j>=5.0.0",
    "docker>=7.0.0",
    "httpx>=0.24.0",
    "chromadb>=0.4.0",
]

[project.scripts]
arbalest = "arbalest_cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness rules enforced consistently across the existing code.
# Additional stylistic rules can be introduced incrementally without blocking
# security and reliability checks on the launch branch.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["engine", "tests"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"
filterwarnings = [
  # pytest-asyncio 0.26 still calls the deprecated event-loop-policy API when
  # the suite is run on the local Python 3.14 toolchain. The application
  # targets Python 3.12, where the API is not deprecated.
  "ignore:.*event_loop_policy.*:DeprecationWarning:pytest_asyncio.plugin",
]
