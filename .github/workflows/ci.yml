name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked toolchain
        run: python -m pip install uv==0.11.21
      - name: Sync locked dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check production code
        run: uv run mypy
      - name: Unit and contract tests
        run: uv run pytest -q
      - name: Static security checks
        run: uv run bandit -q -ll -r engine arbalest_cli.py mcp_server.py
      - name: Dependency audit
        run: uv run pip-audit -r requirements.txt
      - name: Build distributions
        run: uv build

  typescript-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream commit
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install locked TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund
      - name: Compile and test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test
      - name: Check local SDK package contents without publishing
        working-directory: sdk/typescript
        run: npm pack --dry-run
